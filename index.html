function drawChips(){ $("chips").innerHTML=cats.map(c=>`<button class="chip" data-cat="${c}">${c}</button>`).join("")}
function render(){
 let a=CHANNELS;
 if(mode==="popular")a=CHANNELS.filter(x=>popularNames.includes(x.name));
 if(mode==="fav")a=CHANNELS.filter(x=>fav.has(x.name));
 if(mode==="sport")a=CHANNELS.filter(x=>x.cat==="กีฬา");
 if(mode==="cat")a=CHANNELS.filter(x=>modeCat==="ทั้งหมด"||x.cat===modeCat);
 if(q)a=a.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));
 $("title").textContent=mode==="popular"?"ช่องยอดนิยม":mode==="fav"?"ช่องโปรด":mode==="sport"?"กีฬา":modeCat||"ช่องทั้งหมด";
 $("count").textContent=a.length+" ช่อง";
 $("grid").innerHTML=a.length?a.map(x=>`<article class="card" data-n="${x.name}"><div class="thumb"><span class="badge">LIVE</span><button class="fav" data-f="${x.name}">${fav.has(x.name)?"★":"☆"}</button><span class="abbr">${x.abbr}</span></div><div class="info"><div class="name">${x.name}</div><div class="meta"><span>${x.cat}</span><span class="dot">● สด</span></div></div></article>`).join(""):`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#748097">ไม่พบช่อง</div>`;
}
function open(x){url=x.url;$("vtitle").textContent=x.name;$("frame").src=x.url;$("viewer").classList.add("show")}
let modeCat="ทั้งหมด";drawChips();render();
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-cat]");if(c){mode="cat";modeCat=c.dataset.cat;render();return}
 const f=e.target.closest("[data-f]");if(f){e.stopPropagation();fav.has(f.dataset.f)?fav.delete(f.dataset.f):fav.add(f.dataset.f);localStorage.setItem("v10fav",JSON.stringify([...fav]));render();return}
 const card=e.target.closest(".card");if(card){let x=CHANNELS.find(v=>v.name===card.dataset.n);if(x)open(x)}
});
$("search").oninput=e=>{q=e.target.value;render()};
$("home").onclick=()=>{mode="popular";render()};$("fav").onclick=()=>{mode="fav";render()};$("sport").onclick=()=>{mode="sport";render()};$("trueid").onclick=()=>open(CHANNELS.find(x=>x.name==="TrueID Live"));
$("popular").onclick=()=>{mode="popular";render()};$("all").onclick=()=>{mode="cat";modeCat="ทั้งหมด";render()};$("refresh").onclick=()=>location.reload();
$("back").onclick=()=>{$("frame").src="about:blank";$("viewer").classList.remove("show")};$("ext").onclick=()=>window.open(url,"_blank","noopener,noreferrer");
</script></body></html>
